[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mifid-advisory"
version = "0.1.0"
description = "Piattaforma di consulenza finanziaria con profilazione MiFID II: questionario, profilo di rischio, proposta ottimizzata, verifica di adeguatezza e registro di audit, esposti come API REST"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francesco Torraco" }]
keywords = ["mifid ii", "suitability", "robo-advisor", "wealth management", "fastapi", "postgresql", "audit"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
mifid-advisory = "mifid_advisory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mifid_advisory = ["templates/*.j2", "static/*", "dati/*.json", "migrazioni/*.py", "migrazioni/*.mako", "migrazioni/versions/*.py", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/mifid_advisory/migrazioni/versions/*" = ["E501", "UP", "I", "W"]
