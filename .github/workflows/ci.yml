name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mifid
          POSTGRES_PASSWORD: mifid
          POSTGRES_DB: mifid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mifid" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MIFID_TEST_POSTGRES: postgresql://mifid:mifid@localhost:5432/mifid_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Test (SQLite e PostgreSQL)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build e avvio dello stack con docker compose
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors http://localhost:8000/salute
          TOKEN=$(curl -s -X POST -d "username=consulente@demo.it&password=demo" http://localhost:8000/auth/token | python -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          curl --fail -s -H "Authorization: Bearer $TOKEN" http://localhost:8000/clienti | python -m json.tool
      - if: always()
        run: docker compose logs api
